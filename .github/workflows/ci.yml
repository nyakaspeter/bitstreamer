name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\.vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Use the runner's vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --quiet origin
          New-Item -ItemType Directory -Force "${{ github.workspace }}\.vcpkg-cache" | Out-Null

      # FFmpeg and Qt are built from source by vcpkg; cache the binary packages.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure, build, test and package
        shell: pwsh
        run: ./build.ps1 -Preset release -Test -Package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bitstreamer-win64
          path: |
            build/release/bitstreamer-*-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/bitstreamer-*-win64.zip
